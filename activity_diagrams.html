            text-align: center;
            color: #333;

        }
        svg {
            display: block;

        .activity-rect {
            fill: white;
            stroke: black;
            stroke-width: 2;
            rx: 5;
            ry: 5;
        }
        .decision-diamond {
            fill: white;
            stroke: black;
            stroke-width: 2;
        }
        .start-circle {

            stroke-width: 2;
        }
        .end-circle {

            stroke-width: 2;
        }
        .text {

            font-family: "SimSun", serif;
        }
        .arrow {
            stroke: black;
            stroke-width: 2;
            fill: none;
        }
        .diagram-caption {
